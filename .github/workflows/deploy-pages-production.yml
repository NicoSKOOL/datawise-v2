name: Deploy DataWise Pages Production

# Production publishes automatically when something is merged into the
# `production` branch (the single source of truth), and can also be run
# manually as a fallback. Builds happen here on GitHub from `production`
# itself, so a stale local copy can never reach the live site.
#
# Two jobs, in order:
#   1. worker: if anything under workers/ changed in this push, typecheck,
#      test, and deploy the datawise-api Worker from `production`. Skipped
#      (and reported as success) when the push did not touch the Worker.
#   2. pages:  build, guard, and deploy the SPA. Waits for the worker job, so
#      the SPA never goes live before an API route it depends on, and a failed
#      Worker test blocks the whole release instead of shipping half of it.
#
# The Worker used to be deployed by hand from whatever branch was checked out,
# which silently rolled back fixes that were live but not on that branch
# (PR #140, 2026-09-08). Deploying it here from `production` ends that.
on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Also deploy the datawise-api Worker from production
        type: boolean
        default: false

concurrency:
  group: datawise-pages-production
  cancel-in-progress: false

jobs:
  worker:
    name: Worker (datawise-api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 510d0ac03a3a8f5ebeac39be4926ed77
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Did this push change the Worker?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ github.event.inputs.deploy_worker }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Manual run asked for a Worker deploy."; exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "No previous commit to diff against; skipping Worker deploy (run manually with deploy_worker if needed)."; exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- datawise-seo-insight-main/workers; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Worker unchanged in this push; skipping."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"; git diff --stat "$BEFORE" HEAD -- datawise-seo-insight-main/workers | tail -5
          fi

      - name: Setup Node
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: datawise-seo-insight-main/workers/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.deploy == 'true'
        working-directory: datawise-seo-insight-main/workers
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.deploy == 'true'
        working-directory: datawise-seo-insight-main/workers
        run: npx tsc --noEmit

      - name: Unit tests
        if: steps.changes.outputs.deploy == 'true'
        working-directory: datawise-seo-insight-main/workers
        run: npx vitest run

      - name: Deploy Worker
        if: steps.changes.outputs.deploy == 'true'
        working-directory: datawise-seo-insight-main/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

  pages:
    name: Build, guard, and deploy
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 510d0ac03a3a8f5ebeac39be4926ed77
      VITE_API_URL: https://datawise-api.nico-510.workers.dev
      VITE_MCP_URL: https://mcp.datawiseseo.com
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: datawise-seo-insight-main/package-lock.json

      - name: Install dependencies
        working-directory: datawise-seo-insight-main
        # --legacy-peer-deps: the lockfile was generated this way; an
        # unresolved peer (@lobehub/icons -> @lobehub/ui) otherwise breaks
        # `npm ci` on a clean runner. Does not change runtime code.
        run: npm ci --legacy-peer-deps

      - name: Build, guard, and deploy
        working-directory: datawise-seo-insight-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:pages:production
