name: Deploy DataWise Pages Production

on:
  workflow_dispatch:
    inputs:
      preview_verified:
        description: "Type PREVIEW_VERIFIED after verifying the staging/preview URL."
        required: true

concurrency:
  group: datawise-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, guard, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 510d0ac03a3a8f5ebeac39be4926ed77
      VITE_API_URL: https://datawise-api.nico-510.workers.dev
    steps:
      - name: Require preview verification
        run: |
          if [ "${{ github.event.inputs.preview_verified }}" != "PREVIEW_VERIFIED" ]; then
            echo "Production deploy blocked. Verify a staging/preview URL first, then rerun with PREVIEW_VERIFIED."
            exit 1
          fi

      - name: Require Cloudflare deploy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub repo secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token that can deploy the datawise Pages project."
            exit 1
          fi

      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: datawise-seo-insight-main/package-lock.json

      - name: Install dependencies
        working-directory: datawise-seo-insight-main
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build, guard, and deploy
        working-directory: datawise-seo-insight-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:pages:production
