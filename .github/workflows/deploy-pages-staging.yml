name: Deploy DataWise Pages Staging

# Staging deploy. Runs the SAME guard as production (in check mode) and then
# publishes to the permanent staging URL: https://staging.datawise.pages.dev
#
# Triggers:
#   - push to the `staging` branch (normal path: push your change, see it on staging)
#   - manual run choosing any branch (workflow_dispatch)
#
# Builds happen on GitHub from the chosen branch HEAD, never from a laptop,
# so a stale local copy can never be what gets tested.
#
# The branch's Worker code is uploaded as a Worker *version* with the
# `staging` preview alias (https://staging-datawise-api.nico-510.workers.dev)
# and the staging SPA is built against it. An uploaded version gets NO live
# traffic and runs no crons; only a deploy from `production` does. It shares
# the live D1/KV/R2 bindings and secrets, so treat staging data as real.
# Google sign-in / Search Console / Bing connect started on staging need the
# preview alias callback URLs registered with each OAuth provider.

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy to staging
        required: true
        default: staging

concurrency:
  group: datawise-pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, guard, and deploy to staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 510d0ac03a3a8f5ebeac39be4926ed77
      VITE_API_URL: https://datawise-api.nico-510.workers.dev
      # The guard checks the build against the live API URL; the staging
      # script then rebuilds against this preview alias before publishing.
      STAGING_API_URL: https://staging-datawise-api.nico-510.workers.dev
      VITE_MCP_URL: https://mcp.datawiseseo.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: datawise-seo-insight-main/package-lock.json

      - name: Setup Node (Worker)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: datawise-seo-insight-main/workers/package-lock.json

      - name: Upload Worker preview version (no live traffic)
        working-directory: datawise-seo-insight-main/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npm run deploy:preview -- --message "staging ${GITHUB_SHA::7}"

      - name: Install dependencies
        working-directory: datawise-seo-insight-main
        # --legacy-peer-deps: the lockfile was generated this way; an
        # unresolved peer (@lobehub/icons -> @lobehub/ui) otherwise breaks
        # `npm ci` on a clean runner. Does not change runtime code.
        run: npm ci --legacy-peer-deps

      - name: Build, guard, and deploy to staging
        working-directory: datawise-seo-insight-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:pages:staging
