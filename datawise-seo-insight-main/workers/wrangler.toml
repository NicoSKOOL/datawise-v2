name = "datawise-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[triggers]
# Site audit queue heartbeat at */5 (down from */2). User-triggered audits do not
# wait on this cron — handleListAudits / audit-create call processSiteAuditQueue
# inline, so cron is just a backstop for tab-closed / crashed sessions.
# "0 6 * * 1": weekly AI visibility tracking run (Monday 06:00 UTC) — see
# src/routes/ai-tracking.ts runScheduledAIChecks (KV key `ai-tracking-paused`
# is the kill switch).
# "0 8 * * 2,4,6": scheduled SERP rank checks for tracked-keyword projects
# (Tue/Thu/Sat 08:00 UTC) — see src/routes/rank-tracking.ts
# runScheduledRankChecks (KV key `rank-checks-paused` is the kill switch;
# session-gated; 200 keywords/run cap because DFS live = 1 task per request).
crons = ["*/5 * * * *", "0 11 * * *", "0 */6 * * *", "0 6 * * 1", "0 8 * * 2,4,6"]

[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "https://datawiseseo.com"
# Note: For production, change to your actual domain
# Set these via `wrangler secret put`:
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# ENCRYPTION_KEY
# DATAFORSEO_EMAIL
# DATAFORSEO_PASSWORD

[[d1_databases]]
binding = "DB"
database_name = "datawise-db"
database_id = "b9355723-e02c-4877-8dce-c57cc1965068"

[[kv_namespaces]]
binding = "KV"
id = "2302e0b0369842e799b5f4a144d6dce4"
preview_id = "30288cb442c84e038406b0e174f90398"

# Site Audit to-do attachments (10 MB cap, images + PDFs) — see
# handleUploadTaskAttachment in src/routes/site-audit.ts. The bucket exists
# since 2026-04-19 but the top-level binding was missing, so the feature
# 500'd on every upload in production.
[[r2_buckets]]
binding = "TASK_ATTACHMENTS"
bucket_name = "datawise-task-attachments"
