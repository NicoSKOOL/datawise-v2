name = "datawise-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[triggers]
# Site audit queue heartbeat at */5 (down from */2). User-triggered audits do not
# wait on this cron — handleListAudits / audit-create call processSiteAuditQueue
# inline, so cron is just a backstop for tab-closed / crashed sessions.
# "*/5 * * * *" also runs the GSC sync slice: see src/gsc/sync-runner.ts
# runGSCSyncSlice. It replaced a single 11-minute daily run, because the limit
# on how many properties one run can sync is the per-invocation subrequest cap,
# not wall-clock time; 10 properties per tick is ~2,880 attempts a day against
# a due set of 2,234 (measured 2026-09-23), where the daily run managed ~35 a
# night. KV key `gsc-sync-paused` is the kill switch, `gsc-sync-last-slice`
# holds the most recent run summary.
# "0 11 * * *" no longer syncs GSC. It is kept only as a second site-audit
# queue backstop; do not add work to it without reading the note above first.
# "0 6 * * *": daily AI visibility tracking slice (06:00 UTC) — see
# src/routes/ai-tracking.ts runScheduledAIChecks. Each tick checks the queries
# not scheduled-checked in the last 6 days, stalest project first, under a
# 12-minute wall-clock budget; so every query still gets one check per week,
# spread over seven ticks instead of one Monday run that could only finish
# ~100 of 800+ queries before the 15-minute cron wall. KV key
# `ai-tracking-paused` is the kill switch.
# "0 8 * * 2,4,6": scheduled SERP rank checks for tracked-keyword projects
# (Tue/Thu/Sat 08:00 UTC) — see src/routes/rank-tracking.ts
# runScheduledRankChecks (KV key `rank-checks-paused` is the kill switch;
# session-gated; 200 keywords/run cap because DFS live = 1 task per request).
# "0 4 * * *": daily Resend contact sync — see src/email/resend-contacts.ts
# syncResendContacts (cursor in KV `resend-sync-cursor`, time-budgeted; unchanged
# contacts cost zero API calls so the steady state is nearly free). Seed the
# initial load with POST /api/admin/email/sync-contacts rather than waiting for
# this to walk the table.
crons = ["*/5 * * * *", "0 11 * * *", "0 */6 * * *", "0 6 * * *", "0 8 * * 2,4,6", "0 4 * * *"]

# Workers Logs retention. Without this there are no retained logs at all, which
# is why the GSC sync could stamp only ~35 properties a night for months
# without anyone being able to see why: the cron path writes no app_events
# rows either (it bypasses the HTTP middleware), so the run summary line had
# nowhere to land. head_sampling_rate = 1 keeps every invocation.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "https://datawiseseo.com"
ADMIN_EMAILS = "nico@airankingskool.com"
# Note: For production, change to your actual domain
# Set these via `wrangler secret put`:
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# ENCRYPTION_KEY
# DATAFORSEO_EMAIL
# DATAFORSEO_PASSWORD

[[d1_databases]]
binding = "DB"
database_name = "datawise-db"
database_id = "b9355723-e02c-4877-8dce-c57cc1965068"

[[kv_namespaces]]
binding = "KV"
id = "2302e0b0369842e799b5f4a144d6dce4"
preview_id = "30288cb442c84e038406b0e174f90398"

# Site Audit to-do attachments (10 MB cap, images + PDFs) — see
# handleUploadTaskAttachment in src/routes/site-audit.ts. The bucket exists
# since 2026-04-19 but the top-level binding was missing, so the feature
# 500'd on every upload in production.
[[r2_buckets]]
binding = "TASK_ATTACHMENTS"
bucket_name = "datawise-task-attachments"

# --- Blueprint module bindings (admin-gated feature, see workers/src/blueprint/README.md) ---

[[d1_databases]]
binding = "BLUEPRINT_DB"
database_name = "blueprint-db"
database_id = "ec2c0572-1ab9-482f-8c56-d4ed11f8734e"

[[kv_namespaces]]
binding = "BLUEPRINT_KV"
id = "2e39413c266e4d9e804ca34e901259f7"

[[r2_buckets]]
binding = "BLUEPRINT_ARTIFACTS"
bucket_name = "blueprint-artifacts"

[[queues.producers]]
binding = "BLUEPRINT_QUEUE"
queue = "blueprint-research"

[[queues.consumers]]
queue = "blueprint-research"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "blueprint-research-dlq"

# Workers AI: embed_keyword_features (Blueprint Phase 4 clustering track)
# calls @cf/baai/bge-m3 through this binding. Free tier, no budget
# reservation (see workers/src/blueprint/providers/embeddings/workers-ai.ts).
[ai]
binding = "AI"
