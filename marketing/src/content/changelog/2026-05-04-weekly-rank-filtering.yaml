releaseDate: "2026-05-04"
title: "Filter keywords by position, plus a smarter dashboard"
summary: "Click any distribution tier to filter your keyword table, and your dashboard now loads even when you haven't set up rank tracking yet."
changes:
  - type: feature
    title: "Click a position tier to filter your keyword table"
    description: >
      The Top 3, Top 10, and new 11–30 position tiers in the Rank Tracking
      distribution panel are now clickable. Selecting a tier instantly filters
      the keyword table to show only queries in that position range, so you
      can focus on the segment that matters most.
  - type: improvement
    title: "Page 2 Opportunities card now auto-sorts by impressions"
    description: >
      The "Visibility Score" card has been renamed to "Page 2 Opportunities"
      to better reflect what it shows. Clicking it now automatically sorts the
      keyword list by impressions descending, surfacing the highest-traffic
      keywords stuck on page two first.
  - type: fix
    title: "Dashboard shows your GSC data even without rank tracking projects"
    description: >
      The dashboard KPI cards and trend chart were previously hidden until you
      had at least one rank tracking project set up. They now appear as soon as
      your Google Search Console account is connected, so you get value from day one.
