  - title: Brief content that actually gets cited
    description: "Each fan-out query is a heading, FAQ, or paragraph waiting to be written. Pages that cover the whole expansion get pulled into AI Overviews, Perplexity citations, and ChatGPT answers because they match how the engine reasons, not just how the user typed."
