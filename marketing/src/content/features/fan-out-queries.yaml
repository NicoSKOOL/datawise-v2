faqs:
  - question: "What is a query fan-out, and why does it matter for AI search?"
    answer: "A query fan-out is the cluster of sub-queries an AI engine silently expands a single user prompt into before it assembles an answer. When someone asks ChatGPT or Google AI Mode a question, the engine does not look up the literal string. It fans the query out into related sub-questions, gathers passages that answer each one, and synthesises the final response. Pages that cover the whole fan-out cluster get cited because they match the engine's reasoning trace, not just the headline term. Optimising for fan-out is one of the highest-leverage generative engine optimization (GEO) tactics available right now."
  - question: "How is this different from keyword research or People Also Ask?"
    answer: "Traditional keyword research surfaces what people type into the search bar. People Also Ask surfaces related questions Google has already clustered. Fan-out Queries goes one layer deeper: it shows the sub-questions an AI engine expands the seed query into internally, before it answers. Many of those sub-queries never appear in classic keyword tools because they are reasoning steps, not user inputs. That is exactly why pages built against the fan-out cluster get cited where pages built against the keyword alone do not."
  - question: "Which AI engines does Fan-out Queries model?"
    answer: "DataWise's fan-out logic mirrors how Google AI Mode, ChatGPT (including Deep Research), and Perplexity expand and reason about queries. These engines drive the bulk of AI search traffic and citations as of 2026, and their expansion logic is similar enough that a single fan-out cluster is a reliable brief for all three. As new engines and reasoning patterns emerge, the tool updates so the cluster stays representative of how AI actually searches."
  - question: "How do I use a fan-out to brief a page?"
    answer: "Run the fan-out for the page's target keyword, then use each sub-query as a heading, FAQ row, or paragraph in the outline. Cover the head term in the introduction, then dedicate a clearly-labelled section to each major sub-query, and close with an FAQ block that hits the remaining ones. Push the cluster directly into Content Writer to skip the manual outlining step, or export it into Content Planner if the brief belongs to a wider editorial calendar."
  - question: "Will my page rank in classic Google if I optimise for fan-out?"
    answer: "Yes, and usually better. Pages that cover the full intent surface satisfy both classic ranking signals (topical depth, entity coverage, internal linking) and AI citation signals (clear answer formatting, sub-question coverage). The same content that earns Perplexity citations tends to earn featured snippets and Google AI Overviews coverage, because AI Overviews are pulled from pages that already rank well organically. Fan-out optimisation lifts both channels at once."
  - question: "How does Fan-out Queries connect to AI Visibility and Content Writer?"
    answer: "Fan-out Queries sits upstream of both. AI Visibility tells you whether AI already cites you for a given keyword. If it does not, Fan-out Queries shows you the sub-questions a citation-worthy page would need to cover. Content Writer then turns the cluster into a draft, with each sub-query mapped to a heading or FAQ row. The three tools form a closed loop: track citations, find the gaps, and ship the pages that close them."
  - question: "How often should I rerun the fan-out for a given keyword?"
    answer: "Fan-out clusters drift as AI engines update their reasoning, new sub-questions enter the public conversation, and competitor pages reshape what is considered comprehensive. For evergreen pillar topics, rerunning every quarter catches most of the drift. For fast-moving categories (AI itself, regulation-sensitive niches, breaking-news verticals), monthly is safer. The Question Library keeps prior runs so you can diff against the latest cluster and ship a focused refresh rather than a full rewrite."

