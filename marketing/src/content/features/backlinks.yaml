faqs:
  - question: "How accurate is DataWise's backlink data compared to Ahrefs or Semrush?"
    answer: "DataWise's backlink data is powered by DataForSEO, which operates one of the largest independent link indexes on the internet (billions of live links across tens of millions of domains). Coverage for major sites is generally on par with Ahrefs and Semrush; for long-tail domains, any single vendor will miss some links, so it's normal to see small differences between tools. The important thing is consistency: because every analysis in DataWise uses the same source, you can trust the trends, rankings, and comparisons even if the raw totals differ slightly from another platform. And unlike Ahrefs Lite at $129 a month, every backlink report is included with your membership."
  - question: "What is domain rank and how is it calculated?"
    answer: "Domain rank is a 0 to 100 score that estimates the overall authority and ranking power of a domain based primarily on the quantity and quality of backlinks pointing at it. It's calibrated against live SERP data, so a domain with a rank of 80 really does outrank a domain with a rank of 20 far more often than not. Think of it as a calibrated proxy for how much link equity a site has accumulated. It is not the only signal Google uses, but it is one of the strongest, and tracking your domain rank over time is the cleanest single-number representation of whether your link building is working."
  - question: "Should I disavow backlinks, and how do I know which ones?"
    answer: "Disavowing is a defensive tool and should be used sparingly. Google explicitly says most sites don't need it because the search engine already ignores most spammy links automatically. That said, if you have a history of shady link building (past agency, PBN purchases, mass directory submissions) or if you see a manual action in Search Console, disavowing is warranted. Use the backlink tab in DataWise, sort by spam score, inspect the lowest-quality domains manually, and add only the clearly toxic ones to your disavow file. A typical disavow list is tens of domains, not thousands. When in doubt, leave it out."
  - question: "What is the difference between referring domains and backlinks?"
    answer: "Backlinks are individual links, referring domains are the unique sites those links come from. One domain can link to you a hundred times and still count as a single referring domain. For ranking purposes, referring domains is the more useful metric, a hundred links from fifty distinct domains is almost always better than a hundred links from five domains. DataWise surfaces both numbers prominently on the overview so you can judge profile diversity at a glance."
  - question: "How do I find the backlinks my competitors have that I don't?"
    answer: "Open any domain in the backlink analyzer, switch to the Competitor gap tab, and enter up to three rival domains. DataWise performs an intersection query across all backlink profiles and returns the referring domains that link to your competitors but do not currently link to you, ranked by domain rank. Filter by country, TLD, or anchor type to narrow it down. The output is a clean CSV-exportable list of the highest-probability outreach targets in your niche, already qualified by the fact that at least one peer has earned a link from them."
  - question: "How often should I audit my backlink profile?"
    answer: "A full audit is useful quarterly, since link building results trail content work by weeks or months. For ongoing monitoring, the monthly new-vs-lost velocity chart is enough to spot problems early without drowning in data. If you run PR or publish content regularly, increase the check-in cadence to weekly during active campaigns so you can attribute specific link gains or losses to specific activities. After a site migration or redesign, audit twice in the first month, catching broken inbound links early is the single highest-ROI thing you can do with a backlink tool."
  - question: "What is the anchor text distribution, and why does it matter?"
    answer: "Anchor text is the visible, clickable text of a link, and Google uses the anchor text of incoming links as one signal of what a page is about. A natural backlink profile has a diverse anchor mix: branded terms, naked URLs, generic clicks like 'learn more,' and a smaller share of topical or money-keyword anchors. When exact-match anchors for a single high-value keyword exceed about ten to fifteen percent of the mix, the profile looks engineered and becomes a manual-penalty risk. DataWise shows you the full distribution in one chart so you can catch over-optimization early and rebalance with natural links before it causes trouble."

