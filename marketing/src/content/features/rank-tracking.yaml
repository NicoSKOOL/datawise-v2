faqs:
  - question: How often does the rank tracker update keyword positions?
    answer: "DataWise syncs ranking data from Google Search Console every 24 hours. GSC itself typically reflects the previous day's data, so your dashboard is always within one cycle of Google's own record. For most SEO workflows, daily refresh is the right cadence: frequent enough to catch sudden drops, stable enough to filter out single-day noise."
  - question: Can a rank tracker show my local pack rankings?
    answer: "Yes. DataWise includes a dedicated Local Pack sub-tool that tracks your presence in Google's local 3-pack results for location-based queries. You can monitor which keywords trigger a map pack, whether your business appears in it, and when a competitor displaces you. This is separate from standard organic tracking and is designed specifically for local SEO workflows."
  - question: "What is the difference between a rank tracker and Google Search Console?"
    answer: "Google Search Console shows you raw impressions, clicks, and average position across all your queries, but it does not surface trends clearly, does not alert you to drops, and does not let you build a focused watchlist. A keyword rank tracker like DataWise layers dashboards, position deltas, and alerts on top of the same underlying GSC data so you can act on changes instead of just observing them."
  - question: Can I track mobile and desktop rankings separately?
    answer: "Google Search Console separates data by device type, and DataWise exposes that segmentation in your ranking reports. You can compare position and CTR for mobile versus desktop on the same keyword, which is especially useful when a page ranks well on desktop but drops on mobile after a layout change or Core Web Vitals regression."
  - question: How many keywords can I track with my AI Ranking membership?
    answer: "Your AI Ranking community membership ($27/mo, 7-day risk-free trial) includes unlimited GSC-backed rank tracking on every property you connect, which surfaces every keyword Google already reports for your site. For the manual Tracked Keywords watchlist, you get up to 25 priority keywords per project with daily position monitoring out of the box, and you can run multiple projects across your portfolio under a single membership."
  - question: Does rank tracking include SERP features like featured snippets and AI Overviews?
    answer: "DataWise flags SERP feature presence alongside standard position data. When a tracked keyword shows a featured snippet, People Also Ask box, or AI Overview in the results, that is surfaced in your dashboard so you know whether you hold the feature or a competitor does. This context matters because winning a SERP feature can drive clicks even if your organic position stays the same."
  - question: How do ranking drop alerts work and when should I act on them?
    answer: "DataWise highlights keywords where position has declined by a configurable threshold since the previous period. When you see a drop alert, the first check is whether multiple pages dropped simultaneously (which suggests an algorithm update) or a single page dropped (which usually points to a content or technical issue). Act immediately on single-page drops tied to a recent publish. For algorithm-related drops, collect 7 to 14 days of data before making changes."
