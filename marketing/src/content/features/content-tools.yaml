faqs:
  - question: What is content decay and how do you detect it?
    answer: "Content decay is the gradual loss of organic rankings and traffic that happens to pages that are no longer updated, have been outpaced by fresher competitor content, or no longer match current search intent. DataWise detects it by monitoring ranking movement over time, comparing click-through rate trends, and flagging pages where impressions remain stable but clicks and positions are declining. This gives you an early warning before the drop becomes significant."
  - question: Will refreshing old content hurt my Google rankings?
    answer: "Refreshing content almost never hurts rankings and frequently improves them, provided the update adds genuine value. Google's systems reward content that is accurate, comprehensive, and current. The risk comes from deleting content or changing URLs without redirects. DataWise recommendations focus on improving existing pages in place, preserving URL structure, and adding depth, so ranking risk is minimal and recovery is the expected outcome."
  - question: How often should I refresh content for SEO?
    answer: "For high-traffic or high-revenue pages, a quarterly review is a reasonable baseline. For informational content in fast-moving industries, monthly monitoring is safer. Rather than a fixed calendar schedule, DataWise surfaces pages when their metrics indicate a meaningful decay signal, so your refresh work is demand-driven by data rather than arbitrary scheduling. This prevents wasting effort on pages that are still performing well."
  - question: Does Google penalize updated or republished content?
    answer: "No. Updating and republishing content is an explicitly recognized best practice, not a violation. Google does not penalize pages for being refreshed. What matters is that the updated content is better than what it replaces, not just cosmetically changed. DataWise recommendations are scoped to substantive improvements: filling content gaps, updating outdated statistics, improving keyword alignment, and strengthening internal links."
  - question: What metrics signal that a page needs a content refresh?
    answer: "The clearest signals are a declining average position in Google Search Console over a rolling 90-day window, falling click-through rate despite stable impressions, increasing keyword cannibalization from newer pages on the same site, and a growing gap between your page and the top-ranking competitors on depth or freshness. DataWise aggregates these signals into a single recovery score per page so you can prioritize without manually pulling each metric."
  - question: Can a content audit tool analyze pages behind authentication or a paywall?
    answer: "DataWise audits publicly crawlable pages and pages connected through your Google Search Console integration. Pages behind a login wall, staging environments, or paywalled content are not directly crawlable. For gated content, you can manually paste page copy into the Service Page Optimizer for on-page analysis, but live ranking and traffic signals require the page to be indexed and tracked in GSC."
  - question: Does this tool write the new content for me, or just tell me what to change?
    answer: "DataWise tells you what to change and why, with enough specificity to act immediately. It identifies which sections are thin, which keywords are missing, which headings need restructuring, and which internal links should be added. It does not generate replacement copy for you. The distinction is intentional: the best content refresh combines tool-driven diagnosis with your own subject matter expertise, which produces better results than AI-generated replacement text alone."
