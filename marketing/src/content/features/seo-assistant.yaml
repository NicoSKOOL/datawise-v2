faqs:
  - question: Does an AI SEO assistant replace a human SEO consultant?
    answer: "Not fully, but it closes the gap significantly for most websites. The DataWise SEO Assistant handles the analytical work that consumes most of a consultant's time: pulling data, identifying patterns, and prioritizing actions. A human consultant still adds value for competitive strategy, technical audits, and stakeholder communication. For small and mid-size sites, the assistant delivers personalized, data-driven guidance that was previously only accessible through expensive monthly retainers."
  - question: Which large language model powers the SEO Assistant?
    answer: "DataWise uses frontier LLMs selected for accuracy and reasoning quality on structured data tasks. The specific model may vary as we evaluate performance. What stays constant is the retrieval layer: every response is grounded in your actual GSC data, not the model's general knowledge. This prevents the hallucinated keyword volumes and generic advice you get when asking a general-purpose AI SEO tool questions about your specific site."
  - question: Is my Google Search Console data private when using an AI SEO tool?
    answer: "Yes. Your GSC data is scoped to your account and never used to train models or shared with other users. DataWise accesses your data read-only through the official Google Search Console API. Queries are processed in isolated sessions. No raw GSC data is retained beyond what is needed to answer your current question. Review our privacy policy for complete data handling details."
  - question: Can the SEO Assistant generate reports or summaries I can share with clients?
    answer: "The assistant generates text-based analysis and recommendations you can copy directly into a client report or internal brief. Formatted PDF export and scheduled reporting are on the product roadmap. The current fastest workflow is to ask the assistant to summarize findings in a specific format, then copy the output into your reporting template. Most users find the assistant's output is already structured clearly enough to use with minimal editing."
  - question: "How is this different from asking ChatGPT general SEO questions?"
    answer: "ChatGPT gives generalized advice based on training data. It cannot see your site, your rankings, or your GSC performance. The DataWise SEO Assistant is connected to your real data. When you ask \"which pages are losing traffic?\" it queries your actual Search Console metrics and returns specific URLs with specific declines. The difference is asking a stranger for directions versus asking someone who has your GPS coordinates and can see the road conditions ahead."
  - question: What kinds of questions can I actually ask the SEO Assistant?
    answer: "You can ask about traffic trends (\"why did my clicks drop last month?\"), keyword opportunities (\"what low-hanging-fruit keywords am I close to ranking for?\"), content performance (\"which pages have high impressions but low CTR?\"), prioritization (\"what should I fix first?\"), and page-level strategy (\"how should I optimize my pricing page for search?\"). The assistant handles both broad strategy questions and specific diagnostic queries about individual URLs or keyword segments."
  - question: Does the AI SEO Assistant learn from my site over time?
    answer: "The assistant has access to your full GSC history each session, so it can reason about trends over time: comparing current performance to 90 days ago, or identifying seasonal patterns in your data. It does not retain memory between separate conversations. Each new session starts fresh but with full access to your synced GSC data. Persistent cross-session memory is a planned feature. For now, providing brief context at the start of each session (such as a recent site redesign or campaign launch) improves recommendation quality."
