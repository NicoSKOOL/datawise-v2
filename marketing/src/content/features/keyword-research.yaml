faqs:
  - question: What is a keyword research tool and how does it work?
    answer: "A keyword research tool pulls search data (monthly volume, cost-per-click, competition, SERP features) for any query you enter, then suggests related terms your audience is already searching for. DataWise connects directly to DataForSEO's live index, so every metric is fresh and covers 200+ countries. You enter a seed keyword, URL, or competitor, and in seconds you get the full landscape: what people search, how hard it is to rank, and which angles your competitors already cover."
  - question: Are free keyword research tools accurate?
    answer: "Most free tools cap you at a handful of lookups, show stale data, or hide search volume behind a paywall. DataWise is different: it is included with your AI Ranking community membership (from $27/mo, 7-day risk-free trial) and uses the same enterprise-grade data source (DataForSEO) that paid platforms charge $99+/month for. You get unlimited keyword lookups, real monthly search volume, and live SERP data, all for a single community membership instead of a stacked tool bill."
  - question: What metrics should I look at when doing keyword research?
    answer: "The five that matter most: (1) Search volume — how many people search it each month, (2) Keyword difficulty — how hard it is to rank on page one, (3) CPC — what advertisers pay, a proxy for commercial intent, (4) Search intent — informational, navigational, commercial, or transactional, and (5) SERP features — whether Google shows featured snippets, People Also Ask, local packs, or AI overviews that may steal clicks. DataWise surfaces all five in a single view so you can judge opportunity at a glance."
  - question: How is keyword difficulty calculated?
    answer: "Keyword difficulty estimates how competitive the top 10 results are by analyzing the authority, backlink profile, and content depth of the pages currently ranking. DataWise scores every keyword from 0 to 100: below 30 is usually achievable for newer sites, 30-60 takes solid content and some backlinks, and 60+ typically requires a strong domain. Use difficulty together with search volume — a low-volume, low-difficulty keyword you can actually rank for beats a high-volume one you will never crack."
  - question: What is the difference between short-tail and long-tail keywords?
    answer: "Short-tail keywords are 1-2 word queries like 'running shoes' — huge volume, huge competition, often vague intent. Long-tail keywords are longer, more specific phrases like 'best running shoes for flat feet under $100' — lower volume but far higher intent and easier to rank. A healthy SEO strategy targets a mix: a few short-tail pillars for authority and dozens of long-tail pages that actually convert. DataWise's Keyword Ideas and Keyword Suggestions tools are built specifically to surface long-tail opportunities at scale."
  - question: How often should I do keyword research?
    answer: "Do a deep research session once per quarter to refresh your content roadmap, plus a quick 10-minute check before every new article or landing page. Search behavior shifts constantly — new trends emerge, competitors publish, and Google changes what it rewards. Tracking rankings inside DataWise between research sessions tells you when it is time to refresh old content or go after a new cluster."
  - question: Can I use DataWise for competitor keyword research?
    answer: "Yes. Enter any competitor's domain into the Competitor Analysis tool and you will see every keyword they rank for, where they rank, estimated traffic, and the keyword gap between your site and theirs. Combine this with Keyword Research to find the keywords your competitors missed entirely — that is where the easiest wins live."
