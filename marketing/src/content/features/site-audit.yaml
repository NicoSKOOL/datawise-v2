# SEO KEYWORD RESEARCH NOTES
# Primary keyword: "site audit tool"
#   - High commercial intent, dominated by Ahrefs / Semrush / Sitechecker.
# Runner-up keywords:
#   - "website audit tool"
#   - "technical seo audit tool"
#   - "free site audit"
# LSI and supporting terms woven into copy:
#   - core web vitals, lcp, cls, inp, page speed
#   - crawl, indexation, robots, sitemap, canonical
#   - meta description, title tag, h1, heading structure
#   - broken link, redirect chain, image weight, webp
#   - kanban, fix list, prioritized issues
# Differentiation from other feature pages:
#   - Outcome-first: the audit ends in a Kanban action board, not a PDF dump.
#   - DataForSEO-powered crawl, no LLM enrichment in the critical path (data integrity rule).
#   - Per-image suggestions (compress / convert to WebP) rather than generic "optimize images" advice.

title: Site Audit
description: Crawl any site and surface the on-page issues that actually move rankings. Speed score, load time, the exact reasons a page is slow, title and meta gaps, heading structure, and a Kanban fix board so issues get shipped, not filed.
metaDescription: "DataWise's site audit tool crawls any URL and returns a prioritized fix list: speed score, page-slowness causes (heavy images, unused JS), title and meta gaps, heading structure, and per-image WebP suggestions, all routed to a Kanban action board."
icon: "📊"
heroTagline: "From audit to action, in one board"

benefits:
  - title: Real performance data, not a vibe check
    description: "Every crawl returns a hard speed score, total load time in seconds, and the specific render-blocking culprits (oversized images, unused JavaScript, missing compression). No guessing where the slowdown is."
  - title: On-page checks that map to ranking factors
    description: "Title tags, meta descriptions, H1 presence, heading order, internal link depth, canonicals, and indexation signals are all checked against Google's documented best practices. If it matters to ranking, it gets graded."
  - title: A fix list that actually ships
    description: "Every issue flows into a Kanban action board with step-by-step remediation notes. Drag from To do to In progress to Done, accountable to you and your team, instead of another report sitting in a Drive folder."

subTools:
  - name: Crawl Overview
    description: "One-screen summary of every page crawled: status codes, response times, page weight, and the count of critical, warning, and info issues per URL."
  - name: Core Web Vitals
    description: "LCP, CLS, INP and total load time per page, color-coded against Google's pass / needs-improvement / fail thresholds, with the heaviest assets called out by name."
  - name: On-Page Issues
    description: "Title tag length, missing meta descriptions, duplicate or missing H1s, broken internal links, redirect chains, and orphan pages, surfaced in one filterable table."
  - name: Image Audit
    description: "Every oversized image flagged with current size, recommended size, and whether converting to WebP would save more than fifty percent of the file weight. Click straight through to the URL that needs work."
  - name: Indexation Check
    description: "Robots.txt, canonical, noindex, and sitemap inclusion checked per URL so you can spot pages Google cannot index and pages it should not be indexing."
  - name: Kanban Action Board
    description: "Every issue auto-promoted to a card with severity, affected URL, and a remediation checklist. Drag through To do, In progress, and Done to actually close the loop."

