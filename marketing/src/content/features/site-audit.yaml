story:
  - caption: "Paste in a URL and start the crawl"
    highlight: "Drop any domain or specific URL, hit Audit, and DataWise spins up a DataForSEO crawl. Most sites return a full report in a couple of minutes."
  - caption: "Read the speed score and the heaviest assets first"
    highlight: "The overview opens on Core Web Vitals and total load time, with the exact images, scripts, and styles slowing the page down ranked by impact."
  - caption: "Send every issue to the Kanban board and ship the fixes"
    highlight: "Click Send to board and every flagged issue becomes a card with a remediation checklist. The audit stops being a document and starts being a backlog you can burn down."

opportunities:
  - title: "Compress the images dragging down your LCP"
    description: "The image audit names every oversized asset, the URL it sits on, and how much weight a WebP conversion would save. Most sites recover one to three seconds of load time from this alone."
    icon: "target"
  - title: "Catch the missing meta description tax"
    description: "Pages with no meta description hand Google a free pass to write one for you, almost always worse than what you'd write. The audit lists every offender so you can rewrite once and ship in a sprint."
    icon: "edit"
  - title: "Fix heading structure without reading every page"
    description: "Pages with two H1s, no H1, or heading levels skipped (H1 to H4) confuse both Google and screen readers. The audit flags every page with broken heading order so you can fix structure in bulk."
    icon: "list"
  - title: "Find the redirect chains tanking crawl budget"
    description: "Three-hop redirect chains and redirect loops waste crawl budget and frustrate users. The audit traces every chain end to end and tells you exactly which final URL to point at."
    icon: "shuffle"
  - title: "Spot the pages Google should not be indexing"
    description: "Thin tags, faceted-filter URLs, and old campaign landing pages bloat your index and dilute topical authority. The indexation check shows you what's in the index that should not be, ready for a noindex push."
    icon: "shield"
  - title: "Close the loop with a real fix board"
    description: "Most audits die in a PDF nobody opens. The Kanban board turns the audit into a ranked, owner-assignable backlog so the work actually happens and you can prove progress month over month."
    icon: "trending-up"

useCases:
  - icon: "users"
    audience: "SEO agencies and freelancers"
    scenario: "A freelance SEO running a discovery audit pastes a new client's homepage URL, returns in three minutes with a speed score of forty-one, a list of seven oversized hero images, and four pages missing H1s. The Kanban board becomes the first month's deliverable, with the client signing off on each fix as it closes."
  - icon: "pen-tool"
    audience: "Founders and indie hackers"
    scenario: "A founder shipping a new marketing site runs the audit before launch, catches a meta-description gap on six pillar pages and a 4MB hero image on the homepage, and ships fixes the same afternoon. Pre-launch instead of post-mortem."
  - icon: "shield"
    audience: "In-house SEO and dev teams"
    scenario: "An in-house SEO runs the audit weekly against a staging deploy, catches a regression where a recent push reintroduced a 301 to 302 redirect chain, and files a single Kanban card linked to the offending commit. The fix lands in the next sprint without a war room."
  - icon: "trending-up"
    audience: "Content teams owning rankings"
    scenario: "A content lead pulls the audit each month and works the on-page issues board, rewriting title tags and meta descriptions for the bottom-decile CTR pages first. Six weeks in, average position on the rewritten pages is up by 1.4 spots, no new content required."

faqs:
  - question: "How is DataWise's site audit different from Semrush or Ahrefs?"
    answer: "DataWise's site audit is powered by DataForSEO's crawl engine, the same underlying infrastructure many enterprise SEO platforms license. Coverage of standard issues (Core Web Vitals, on-page checks, indexation) is on par with Semrush and Ahrefs. The two real differences: DataWise renders the audit directly from the crawl data with no LLM rewriting in between, so the numbers you see are the numbers DataForSEO returned (memory rule, data integrity matters), and every issue flows into a Kanban action board you actually work, instead of a static PDF you skim once and forget."
  - question: "How long does a site audit take to run?"
    answer: "For most marketing sites under a few hundred pages, the audit completes in two to five minutes. The crawl is asynchronous, so you can kick off an audit, work on something else, and come back to the results when they're ready. Larger sites (thousands of URLs) can take ten to thirty minutes, depending on response times and rate limits, and you'll see the progress count tick up live."
  - question: "Can I audit a competitor's site?"
    answer: "Yes. You can run the audit against any public URL, your own or anyone else's, as long as the site is reachable without authentication. This is one of the fastest ways to spot why a competitor's pages load faster, what their title-tag pattern looks like, and whether they're indexing pages you should be too."
  - question: "Does the audit cover Core Web Vitals (LCP, CLS, INP)?"
    answer: "Yes. Every audited URL returns LCP (Largest Contentful Paint), CLS (Cumulative Layout Shift), and INP (Interaction to Next Paint) measured against Google's pass / needs-improvement / fail thresholds, plus total load time in seconds. For pages that fail, the heaviest contributing assets (oversized images, unused JavaScript, render-blocking styles) are called out by name so you know exactly what to fix."
  - question: "What is the Kanban action board, and why does it matter?"
    answer: "The Kanban action board is where the audit stops being a report and starts being a backlog. Each flagged issue becomes a card with severity, affected URL, and a step-by-step remediation checklist. Drag the card across To do, In progress, and Done. The board is shared per workspace, so a freelancer, in-house SEO, or agency can hand cards to a developer or content writer and actually see the fixes ship. Most audits die in a PDF; this one closes the loop."
  - question: "Do I need to install anything on my site to run the audit?"
    answer: "No installation, no script, no DNS change. The audit crawls your site from the public internet, just like Googlebot does, and reads everything it needs from the live HTML and headers. If your site is reachable in a browser, DataWise can audit it. Authenticated or staging URLs behind a login can be audited by allowlisting our crawler's IPs (instructions in the dashboard)."
  - question: "How often should I run a site audit?"
    answer: "For most marketing sites, monthly is a good cadence: enough to catch regressions early, not so frequent that you drown in repeated findings. After a redesign, migration, or major release, run the audit immediately and again a week later so any cache-invalidation or crawl-budget issues surface. Active dev teams often run the audit against a staging deploy on every release to catch performance and SEO regressions before they ship to production."

