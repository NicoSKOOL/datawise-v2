faqs:
  - question: What does an AI content writer actually do?
    answer: "An AI content writer takes a topic, target keyword, and brief, then generates structured long-form content for blog posts, articles, and landing pages. DataWise Content Writer goes further than a single prompt: it runs four discrete steps (research with citations, outline, draft, review), grounds every article in real-time web sources via Perplexity Sonar Pro, drafts the body with DeepSeek V4 Pro in your brand voice, and exports clean HTML and Markdown. You stay in control at every step rather than receiving one black-box article."
  - question: Will Google penalize content written by an AI SEO content writer?
    answer: "Google's official guidance is that it rewards helpful, accurate, original content regardless of how it was produced, and penalizes thin, scraped, or unhelpful content regardless of authorship. The risk with most AI writers is that they produce ungrounded, generic articles that fail the helpfulness test. DataWise reduces that risk by grounding every article in cited research, drafting against your real Knowledge Base, and giving you human review checkpoints between every step. Treat it as a writing partner you fact-check, not a publish button."
  - question: Can AI-generated content actually rank on Google?
    answer: "Yes, when the underlying article is genuinely useful, accurate, well-structured, and matches search intent. AI content fails to rank when it is shallow, generic, or contradicts authoritative sources. The four-step pipeline is built to address those failure modes: cited research prevents factual drift, the Knowledge Base prevents generic voice, your sitemap-aware internal linking signals topical authority, and the review pass catches obvious tells before publication."
  - question: How is this different from ChatGPT or a generic AI writer?
    answer: "ChatGPT and most generic AI writers are single-prompt black boxes with no grounding. DataWise Content Writer is a four-step pipeline with a research model (Perplexity Sonar Pro for cited, real-time web search) and a separate drafting model (DeepSeek V4 Pro for long-form writing), each tuned for its job. It is also workspace-aware: every post is tied to a Google Search Console property, your Content Planner keywords import in one click, and your Knowledge Base shapes voice and internal linking automatically."
  - question: Does the AI writer cite real sources, or does it make them up?
    answer: "Real sources. The research step runs on Perplexity Sonar Pro, which performs grounded live web search and returns citations for every claim. You review and approve the source list before the writer drafts a single sentence. If a source looks weak, edit it out or rerun research with a different angle. The drafting model then references the approved sources rather than inventing new ones."
  - question: How do I make AI content sound human and on-brand?
    answer: "Three layers: load your tone of voice and brand guidelines into the Knowledge Base, capture genuine first-hand experience notes (case studies, customer quotes, lessons learned) so the writer has substance to draw from, and use the review step to tighten phrasing. The post-processor also strips common AI tells (em-dashes and horizontal-rule artifacts) so drafts arrive cleaner than what you typically get from a raw model."
  - question: Does this AI SEO content writer use my Search Console data?
    answer: "Yes. Each writer workspace is bound 1:1 to a Google Search Console property, so the keywords surfaced in DataWise's keyword research and Content Planner flow directly into the writer with one click. Internal link suggestions also draw from your sitemap, which means drafts link to pages you actually have rather than invented URLs."
